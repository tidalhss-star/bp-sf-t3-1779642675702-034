<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="1275" cy="-52" r="70" fill="#1a1a2e" opacity="0.06"/>
    <circle cx="708" cy="638" r="30" fill="#1a1a2e" opacity="0.10"/>
    <circle cx="1279" cy="-93" r="44" fill="#1a1a2e" opacity="0.06"/>
    <circle cx="412" cy="-64" r="91" fill="#1a1a2e" opacity="0.14"/>
    <circle cx="471" cy="423" r="36" fill="#1a1a2e" opacity="0.15"/>
    <circle cx="1209" cy="-13" r="20" fill="#1a1a2e" opacity="0.08"/>
    <rect x="673" y="256" width="38" height="72" rx="8" fill="#0a0a0a" opacity="0.03" transform="rotate(20, 1273, 22)"/>
    <rect x="1119" y="494" width="70" height="63" rx="8" fill="#0a0a0a" opacity="0.04" transform="rotate(10, 1146, 580)"/>
    <rect x="180" y="541" width="29" height="83" rx="8" fill="#0a0a0a" opacity="0.04" transform="rotate(32, 297, 635)"/>
    <rect x="1030" y="693" width="44" height="51" rx="8" fill="#0a0a0a" opacity="0.06" transform="rotate(29, 358, 466)"/>
    <rect x="440" y="259" width="78" height="86" rx="8" fill="#0a0a0a" opacity="0.12" transform="rotate(18, 950, 229)"/>
    <rect x="678" y="655" width="63" height="99" rx="8" fill="#0a0a0a" opacity="0.11" transform="rotate(29, 979, 618)"/>
    <rect x="1150" y="-52" width="31" height="71" rx="8" fill="#0a0a0a" opacity="0.05" transform="rotate(37, 332, 300)"/>
    <rect x="611" y="391" width="51" height="53" rx="8" fill="#0a0a0a" opacity="0.07" transform="rotate(27, 639, 339)"/>
    <polygon points="878,-97 919,-15 837,-15" fill="#1a1a2e" opacity="0.03"/>
    <polygon points="662,609 747,779 577,779" fill="#1a1a2e" opacity="0.05"/>
    <polygon points="868,44 897,102 839,102" fill="#1a1a2e" opacity="0.08"/>
    <polygon points="813,336 847,404 779,404" fill="#1a1a2e" opacity="0.11"/>

  <!-- Wave at bottom -->
  <path d="M0,536 C360,583 840,489 1200,536 L1200,630 L0,630Z" fill="#1a1a2e" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 셔츠룸
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 서버 웜업
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#7c3aed" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 마포 셔츠룸 — 서버 웜업
  </text>
</svg>